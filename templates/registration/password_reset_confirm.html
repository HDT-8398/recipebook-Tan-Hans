{% extends 'base.html' %}

{% block content %}
    {% if validlink %}
        <h2>Set new password</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Change password</button>
        </form>
    {% else %}
        <p> Invalid password reset link</p>
    {% endif %}
{% endblock %}
