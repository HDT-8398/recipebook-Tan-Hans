{% extends "base.html" %}
{% load static %}

{% block title %}Create Recipe{% endblock %}

{% block content %}
    <h2>Create a new recipe</h2>
    <form method = "POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <input type = 'submit' value = 'Submit'>
    </form>
    <a href="{% url 'ledger:recipe_list' %}">Cancel</a>
{% endblock %}
