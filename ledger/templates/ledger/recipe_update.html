{% extends "base.html" %}
{% load static %}

{% block title %} Add Recipe Image {% endblock %}

{% block content %}
     <h2>Add Image for {{ recipe.name}}</h2>
     <form method = "POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <input type ="submit" value ="Submit">
     </form>
     <a href = "{% url 'ledger:recipe_detail' recipe.pk %}">Cancel</a>
{% endblock %}
